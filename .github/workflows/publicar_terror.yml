name: Bot Terror - Publicación 3x diario
on:
  schedule:
    - cron: '0 14 * * *'   # 8:00 AM CDMX (14:00 UTC)
    - cron: '0 18 * * *'   # 12:00 PM CDMX (18:00 UTC)
    - cron: '0 22 * * *'   # 4:00 PM CDMX (22:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install requests pytz

      - name: Ejecutar bot de terror
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MAKE_WEBHOOK_URL_TERROR: ${{ secrets.MAKE_WEBHOOK_URL_TERROR }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: python bot_terror.py

      - name: Commit y push del estado
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add estado_terror.json
          
          if git diff-index --quiet HEAD; then
            echo "✅ No hay cambios en estado_terror.json"
            exit 0
          fi
          
          git commit -m "Actualizar estado terror [skip ci]"
          
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "✅ Push exitoso"
              break
            fi
            echo "⚠️ Intento $i/5 falló, reintentando en 10s..."
            sleep 10
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
