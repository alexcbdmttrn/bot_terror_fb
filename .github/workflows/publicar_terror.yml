name: Bot Terror - Publicación

on:
  schedule:
    - cron: '0 13 * * *'   # 8:00 AM CDMX (13:00 UTC) → Historia A
    - cron: '0 20 * * *'   # 3:00 PM CDMX (20:00 UTC) → Historia B
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar dependencias de Python
        run: |
          pip install --upgrade pip setuptools wheel
          pip install --force-reinstall moviepy==2.2.1 pillow imageio-ffmpeg
          pip install requests pytz cloudinary gTTS edge-tts

      - name: Ejecutar bot de terror
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MAKE_WEBHOOK_URL_TERROR: ${{ secrets.MAKE_WEBHOOK_URL_TERROR }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: python bot_terror.py

      - name: Commit y push del estado
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add estado_terror.json

          if git diff-index --quiet HEAD; then
            echo "✅ No hay cambios en estado_terror.json"
            exit 0
          fi

          git commit -m "Actualizar estado terror [skip ci]"

          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "✅ Push exitoso"
              break
            fi
            echo "⚠️ Intento $i/5 falló, reintentando en 10s..."
            sleep 10
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
