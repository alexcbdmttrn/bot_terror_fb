name: Bot Terror - Publicación

on:
  schedule:
    - cron: '0 21 * * *'   # 3:00 PM CDMX (21:00 UTC)
    - cron: '0 2 * * *'    # 8:00 PM CDMX (02:00 UTC del día siguiente)
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install requests pytz

      - name: Ejecutar bot de terror
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MAKE_WEBHOOK_URL_TERROR: ${{ secrets.MAKE_WEBHOOK_URL_TERROR }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: python bot_terror.py
